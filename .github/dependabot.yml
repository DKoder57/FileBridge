version: 2
updates:
  # FileBridge é Flutter/Dart, com o pubspec.yaml dentro de /app (não na raiz
  # do repo) - por isso o ecosystem é "pub" e directory aponta pra /app.
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    # Quantos PRs de dependência o Dependabot pode manter abertos ao mesmo
    # tempo antes de parar de abrir novos.
    open-pull-requests-limit: 10
    # Agrupa minor+patch numa única PR em vez de uma PR por dependência.
    # Major fica fora do grupo de propósito - PR separada, pois major
    # costuma quebrar API e merece revisão isolada.
    groups:
      pub-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Cooldown padrão do Dependabot (desde jul/2026) deixado explícito e
    # ajustado por severidade: major espera mais, patch quase não espera.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    # Sem "labels:" de propósito - o Dependabot já cria "dependencies" + "pub"
    # automaticamente em toda PR. Definir manualmente substituiria (não
    # somaria) esse padrão, e labels customizadas só funcionam se já
    # existirem no repositório.

  # Mantém as próprias GitHub Actions atualizadas (ex: actions/checkout@v4).
  # Aplica-se independente da stack - não precisa mexer aqui.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
